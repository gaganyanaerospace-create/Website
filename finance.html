<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaganyan Aerospace — Financial Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --navy:#0b1220;
  --navy-2:#111a2e;
  --ink:#0f1729;
  --ink-soft:#4b5875;
  --line:#e6e9f0;
  --bg:#f6f7fb;
  --card:#ffffff;
  --accent:#4f46e5;
  --accent-2:#7c6ff0;
  --accent-soft:#eef0fe;
  --green:#0ea36f;
  --green-soft:#e6f8f1;
  --red:#e0473d;
  --red-soft:#fdeceb;
  --amber:#d98e04;
  --amber-soft:#fdf3e0;
  --radius:14px;
  --shadow:0 1px 2px rgba(15,23,41,.04), 0 8px 24px -12px rgba(15,23,41,.10);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#d7dbe6;border-radius:8px;}

/* ---------- Login ---------- */
#loginScreen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 600px at 20% -10%, #1b2547 0%, var(--navy) 55%, #070b16 100%);
  padding:20px;
}
.login-card{
  width:100%;max-width:380px;background:var(--card);border-radius:18px;
  padding:36px 32px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);
}
.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.login-brand .mark{
  width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;
}
.login-brand .name{font-weight:700;font-size:16px;letter-spacing:.2px;}
.login-brand .sub{font-size:11px;color:var(--ink-soft);}
.login-card h1{font-size:19px;margin:0 0 4px;}
.login-card p.lead{font-size:13px;color:var(--ink-soft);margin:0 0 22px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  font-size:14px;background:#fbfbfd;color:var(--ink);outline:none;transition:border-color .15s, box-shadow .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:#fff;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 16px;border-radius:10px;border:none;font-size:14px;font-weight:600;
  transition:transform .05s ease, opacity .15s;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--accent);color:#fff;width:100%;}
.btn-primary:hover{opacity:.92;}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
.btn-ghost:hover{background:#f2f3f8;}
.btn-danger{background:var(--red);color:#fff;}
.login-toggle{margin-top:16px;text-align:center;font-size:13px;color:var(--ink-soft);}
.login-toggle a{color:var(--accent);font-weight:600;cursor:pointer;}
.login-error{background:var(--red-soft);color:var(--red);font-size:12.5px;padding:9px 12px;border-radius:8px;margin-bottom:14px;display:none;}
.login-config-note{margin-top:18px;font-size:11.5px;color:#9aa3b8;line-height:1.5;}

/* ---------- App shell ---------- */
#app{display:none;min-height:100vh;}
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:236px;flex-shrink:0;background:var(--navy);color:#cfd6ea;
  display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;
}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px;}
.sidebar .brand .mark{
  width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0;
}
.sidebar .brand .name{color:#fff;font-weight:700;font-size:14.5px;line-height:1.2;}
.sidebar .brand .sub{font-size:10.5px;color:#8891ab;}
.nav-group{margin-top:6px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;
  font-size:13.5px;font-weight:500;color:#aeb6cc;margin-bottom:2px;transition:background .12s,color .12s;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:#161f38;color:#fff;}
.nav-item.active{background:var(--accent);color:#fff;}
.nav-item.active svg{opacity:1;}
.sidebar-footer{margin-top:auto;border-top:1px solid #1c2440;padding-top:14px;}
.sidebar-user{display:flex;align-items:center;gap:9px;padding:6px 8px;}
.sidebar-user .avatar{
  width:30px;height:30px;border-radius:50%;background:#1c2440;color:#fff;font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.sidebar-user .email{font-size:11.5px;color:#9aa3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px;}
.logout-btn{width:100%;margin-top:10px;background:transparent;border:1px solid #262f4c;color:#aeb6cc;padding:8px;border-radius:9px;font-size:12.5px;}
.logout-btn:hover{background:#161f38;color:#fff;}

.main{flex:1;min-width:0;}
.topbar{
  position:sticky;top:0;z-index:5;background:rgba(246,247,251,.85);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.topbar h2{margin:0;font-size:19px;font-weight:700;}
.topbar .page-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.topbar-actions{display:flex;align-items:center;gap:10px;}
.mobile-toggle{display:none;background:none;border:none;font-size:20px;color:var(--ink);}

.date-filter{position:relative;}
.date-filter select{
  padding:9px 30px 9px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;
  font-size:13px;font-weight:600;color:var(--ink);appearance:none;-webkit-appearance:none;
}

.content{padding:24px 28px 60px;}

/* Cards / grid */
.cards-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px;}
.stat-card{
  background:var(--card);border-radius:var(--radius);padding:18px 18px 16px;box-shadow:var(--shadow);
  border:1px solid var(--line);
}
.stat-card .top-row{display:flex;align-items:flex-start;justify-content:space-between;}
.stat-card .icon-wrap{
  width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.stat-card .icon-wrap svg{width:17px;height:17px;}
.stat-card .label{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin:12px 0 4px;}
.stat-card .amount{font-size:23px;font-weight:700;letter-spacing:-.3px;}
.stat-card .delta{font-size:12px;font-weight:600;margin-top:6px;display:flex;align-items:center;gap:4px;}
.delta.up{color:var(--green);}
.delta.down{color:var(--red);}
.delta.flat{color:var(--ink-soft);}

.panel{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);}
.panel-header h3{margin:0;font-size:14.5px;font-weight:700;}
.panel-body{padding:16px 18px;}
.panel-body.no-pad{padding:0;}

.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px;}
.grid-2b{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}

.chart-tabs{display:flex;gap:6px;}
.chart-tab{padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;color:var(--ink-soft);border:1px solid var(--line);background:#fff;}
.chart-tab.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--ink-soft);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding:10px 18px;border-bottom:1px solid var(--line);background:#fafbfd;}
td{padding:12px 18px;border-bottom:1px solid #f0f1f6;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;}
tr.clickable:hover{background:#fafbff;cursor:pointer;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;}
.badge-green{background:var(--green-soft);color:var(--green);}
.badge-red{background:var(--red-soft);color:var(--red);}
.badge-amber{background:var(--amber-soft);color:var(--amber);}
.badge-gray{background:#eef0f5;color:#5a6580;}
.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

.pill-toggle{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.pill{padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink-soft);}
.pill.active{background:var(--ink);color:#fff;border-color:var(--ink);}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.toolbar-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.search-box{position:relative;}
.search-box input{padding:9px 12px 9px 32px;border-radius:10px;border:1px solid var(--line);font-size:13px;width:220px;background:#fff;}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:#9aa3b8;}
.select-sm{padding:8px 10px;border-radius:10px;border:1px solid var(--line);font-size:13px;background:#fff;color:var(--ink);}

.empty-state{padding:50px 20px;text-align:center;}
.empty-state .icon{width:44px;height:44px;margin:0 auto 12px;color:#c7ccdb;}
.empty-state p{color:var(--ink-soft);font-size:13.5px;margin:0 0 14px;}

/* Modal */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(10,14,26,.5);z-index:50;
  align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;
}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;box-shadow:0 30px 70px -20px rgba(0,0,0,.35);}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);}
.modal-header h3{margin:0;font-size:16px;font-weight:700;}
.modal-close{background:none;border:none;font-size:20px;color:var(--ink-soft);line-height:1;}
.modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
.modal-footer{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
.form-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.req{color:var(--red);}

.toast-wrap{position:fixed;top:18px;right:18px;z-index:100;display:flex;flex-direction:column;gap:8px;}
.toast{
  background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;font-weight:500;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.4);display:flex;align-items:center;gap:8px;min-width:220px;
  animation:slideIn .18s ease;
}
.toast.error{background:var(--red);}
.toast.success{background:var(--green);}
@keyframes slideIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}

.loading-row{padding:40px;text-align:center;color:var(--ink-soft);font-size:13px;}
.spinner{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .7s linear infinite;margin:0 auto 10px;}
@keyframes spin{to{transform:rotate(360deg);}}

.client-detail-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
.client-avatar{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;}
.mini-stat{display:flex;flex-direction:column;gap:2px;}
.mini-stat .k{font-size:11px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.3px;}
.mini-stat .v{font-size:16px;font-weight:700;}
.back-link{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:10px;}
.back-link:hover{color:var(--accent);}

@media (max-width: 980px){
  .cards-grid{grid-template-columns:repeat(2,1fr);}
  .grid-2, .grid-2b{grid-template-columns:1fr;}
}
@media (max-width: 720px){
  .sidebar{position:fixed;left:-260px;z-index:40;transition:left .2s ease;box-shadow:20px 0 60px rgba(0,0,0,.3);}
  .sidebar.open{left:0;}
  .mobile-toggle{display:block;}
  .cards-grid{grid-template-columns:1fr;}
  .content{padding:18px 14px 50px;}
  .topbar{padding:14px 16px;}
  .form-row2{grid-template-columns:1fr;}
}
.mark-img{width:36px;height:36px;object-fit:contain;border-radius:50%;background:#fff;flex-shrink:0;}
.sidebar .brand .mark-img{width:32px;height:32px;}
</style>
</head>

function withDefaults(row) { const o = { ...(row || {}) }; for (const k in DEFAULTS) if (!o[k]) o[k] = DEFAULTS[k]; return o; }
function docNumber(p, n) { p = p || ""; return p + (/[A-Za-z0-9]$/.test(p) ? "-" : "") + n; }
function addDaysISO(iso, n) { const d = new Date(iso); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
function inr(amount) {
  const n = Number(amount || 0);
  const sign = n < 0 ? "-" : "";
  const abs = Math.abs(n);
  const parts = abs.toFixed(0).split(".");
  let intPart = parts[0];
  let lastThree = intPart.length > 3 ? intPart.slice(-3) : intPart;
  let other = intPart.length > 3 ? intPart.slice(0, -3) : "";
  if (other !== "") lastThree = "," + lastThree;
  const formatted = other.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + lastThree;
  return `${sign}₹${formatted}`;
}
function fmtDate(d) {
  if (!d) return "—";
  const dt = new Date(d);
  return dt.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
}
function todayISO() { return new Date().toISOString().slice(0, 10); }
function daysAgoISO(n) { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); }
function uid() { return Math.random().toString(36).slice(2, 9); }
function esc(s) { return (s ?? "").toString().replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function initials(name) {
  if (!name) return "?";
  return name.trim().split(/\s+/).slice(0, 2).map(w => w[0]?.toUpperCase() || "").join("");
}

function toast(msg, type = "default") {
  const wrap = document.getElementById("toastWrap");
  const el = document.createElement("div");
  el.className = "toast" + (type === "error" ? " error" : type === "success" ? " success" : "");
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

// client-side derived balances
function clientInvoices(clientId) { return state.invoices.filter(i => i.client_id === clientId); }
function clientPayments(clientId) { return state.payments.filter(p => p.client_id === clientId); }
function totalBilled(clientId) { return clientInvoices(clientId).filter(i => i.status !== "draft").reduce((s, i) => s + Number(i.amount), 0); }
function totalPaid(clientId) { return clientPayments(clientId).reduce((s, p) => s + Number(p.amount), 0); }
function outstanding(clientId) { return totalBilled(clientId) - totalPaid(clientId); }
function clientStatus(clientId) {
  const out = outstanding(clientId);
  if (out <= 0 && totalBilled(clientId) > 0) return "paid";
  const invs = clientInvoices(clientId);
  const overdue = invs.some(i => i.due_date && new Date(i.due_date) < new Date() && out > 0);
  if (overdue) return "overdue";
  if (totalPaid(clientId) > 0 && out > 0) return "partially_paid";
  return "pending";
}
function statusBadge(status) {
  const map = {
    draft: ["badge-gray", "Draft"],
    sent: ["badge-amber", "Sent"],
    paid: ["badge-green", "Paid"],
    pending: ["badge-amber", "Pending"],
    partially_paid: ["badge-amber", "Partially Paid"],
    overdue: ["badge-red", "Overdue"],
    accepted: ["badge-green", "Accepted"],
    rejected: ["badge-red", "Rejected"],
    converted: ["badge-gray", "Converted"],
  };
  const [cls, label] = map[status] || ["badge-gray", status];
  return `<span class="badge ${cls}"><span class="badge-dot"></span>${label}</span>`;
}

async function loadAllData() {

  try {
    const [c, i, p, e, cat, items, settings, qts, qItems] = await Promise.all([
      sb.from("clients").select("*").order("created_at", { ascending: false }),

      sb.from("quotations").select("*").order("quotation_date", { ascending: false }),

function inRange(dateStr, days) {
  if (days === "all") return true;
  const d = new Date(dateStr);
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - Number(days));
  return d >= cutoff;
}
function isThisMonth(dateStr) {
  const d = new Date(dateStr), n = new Date();
  return d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear();
}
function isLastMonth(dateStr) {
  const d = new Date(dateStr), n = new Date();
  const lm = new Date(n.getFullYear(), n.getMonth() - 1, 1);
  return d.getMonth() === lm.getMonth() && d.getFullYear() === lm.getFullYear();
}
function sumIncome(filterFn) { return state.payments.filter(p => filterFn(p.payment_date)).reduce((s, p) => s + Number(p.amount), 0); }
function sumExpense(filterFn) { return state.expenses.filter(e => filterFn(e.expense_date)).reduce((s, e) => s + Number(e.amount), 0); }
function pctDelta(cur, prev) {
  if (prev === 0) return cur === 0 ? 0 : 100;
  return ((cur - prev) / Math.abs(prev)) * 100;
}
function deltaHtml(pct) {
  if (Math.abs(pct) < 0.5) return `<span class="delta flat">– vs last month</span>`;
  const up = pct > 0;
  return `<span class="delta ${up ? "up" : "down"}">${up ? "▲" : "▼"} ${Math.abs(pct).toFixed(1)}% vs last month</span>`;
}

function emptyRow(msg) { return `<div class="loading-row">${msg}</div>`; }

function drawTrendChart() {
  const days = Number(state.dashboardRange);
  const labels = [], incomeData = [], expenseData = [], profitData = [];
  const bucketCount = days <= 30 ? days : days <= 90 ? Math.ceil(days / 3) : Math.ceil(days / 7);
  const bucketSizeDays = Math.max(1, Math.ceil(days / bucketCount));
  for (let i = bucketCount - 1; i >= 0; i--) {
    const end = daysAgoISO(i * bucketSizeDays);
    const start = daysAgoISO((i + 1) * bucketSizeDays - 1);
    const inc = state.payments.filter(p => p.payment_date >= start && p.payment_date <= end).reduce((s, p) => s + Number(p.amount), 0);
    const exp = state.expenses.filter(e => e.expense_date >= start && e.expense_date <= end).reduce((s, e) => s + Number(e.amount), 0);
    labels.push(new Date(end).toLocaleDateString("en-IN", { day: "numeric", month: "short" }));
    incomeData.push(inc); expenseData.push(exp); profitData.push(inc - exp);
  }
  const ctx = document.getElementById("trendCanvas");
  if (!ctx) return;
  if (trendChart) trendChart.destroy();
  trendChart = new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [
        { label: "Income", data: incomeData, borderColor: "#0ea36f", backgroundColor: "rgba(14,163,111,.08)", tension: .35, fill: true, pointRadius: 0 },
        { label: "Expenses", data: expenseData, borderColor: "#e0473d", backgroundColor: "rgba(224,71,61,.06)", tension: .35, fill: true, pointRadius: 0 },
        { label: "Profit", data: profitData, borderColor: "#4f46e5", backgroundColor: "rgba(79,70,229,.06)", tension: .35, fill: true, pointRadius: 0, borderDash: [5, 3] },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 11 } } } },
      scales: {
        y: { ticks: { callback: v => "₹" + (v >= 1000 ? (v / 1000) + "k" : v), font: { size: 10 } }, grid: { color: "#f0f1f6" } },
        x: { grid: { display: false }, ticks: { font: { size: 10 } } },
      },
    },
  });
  document.getElementById("trendCanvas").parentElement.style.height = "260px";
}
function drawCategoryChart() {
  const byCategory = {};
  state.expenses.forEach(e => {
    const cat = state.categories.find(c => c.id === e.category_id)?.name || "Uncategorized";
    byCategory[cat] = (byCategory[cat] || 0) + Number(e.amount);
  });
  const ctx = document.getElementById("categoryCanvas");
  if (!ctx) return;
  if (categoryChart) categoryChart.destroy();
  const labels = Object.keys(byCategory);
  if (!labels.length) { ctx.parentElement.innerHTML = emptyRow("No expenses recorded yet."); return; }
  const palette = ["#4f46e5", "#0ea36f", "#d98e04", "#e0473d", "#7c6ff0", "#22b8cf", "#f472b6", "#94a3b8"];
  categoryChart = new Chart(ctx, {
    type: "doughnut",
    data: { labels, datasets: [{ data: Object.values(byCategory), backgroundColor: labels.map((_, i) => palette[i % palette.length]), borderWidth: 2, borderColor: "#fff" }] },
    options: { responsive: true, maintainAspectRatio: false, cutout: "62%", plugins: { legend: { position: "right", labels: { boxWidth: 9, font: { size: 10.5 } } } } },
  });
  ctx.parentElement.style.height = "210px";
}
function drawClientIncomeChart() {
  const byClient = {};
  state.payments.forEach(p => {

// ---------- 12. MODAL SYSTEM ----------
function openModal(title, bodyHtml, onSubmit, submitLabel = "Save") {
  closeModal();
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay open";
  overlay.id = "activeModal";
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header"><h3>${esc(title)}</h3><button class="modal-close" id="modalCloseBtn">×</button></div>
      <form id="modalForm">
        <div class="modal-body">${bodyHtml}</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" id="modalCancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="modalSubmitBtn">${submitLabel}</button>
        </div>
      </form>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
  document.getElementById("modalCancelBtn").addEventListener("click", closeModal);
  document.getElementById("modalForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("modalSubmitBtn");
    const original = btn.textContent;
    btn.textContent = "Saving…"; btn.disabled = true;
    try {
      await onSubmit(new FormData(e.target));
      closeModal();
    } catch (err) {
      toast(err.message || "Something went wrong.", "error");
      btn.textContent = original; btn.disabled = false;
    }
  });
}
function closeModal() { document.getElementById("activeModal")?.remove(); }

        </select>
      </div>
      <div class="field"><label>Agreed Amount (₹)</label><input type="number" step="0.01" name="agreed_amount" placeholder="0"></div>
    </div>
    <div class="field"><label>Notes</label><textarea name="notes" rows="2"></textarea></div>
    <p style="font-size:12px;color:var(--ink-soft);margin-top:-4px;">

    </p>
  `, async (fd) => {
    const payload = {
      name: fd.get("name"), company_name: fd.get("company_name") || null, phone: fd.get("phone") || null,
      email: fd.get("email") || null, address: fd.get("address") || null, state: fd.get("state") || null, service: fd.get("service") || null,
      billing_frequency: fd.get("billing_frequency"), agreed_amount: Number(fd.get("agreed_amount") || 0),
      notes: fd.get("notes") || null,
      ...(fd.get("gstin") ? { gstin: fd.get("gstin").trim() } : {}),
    };
    const { data, error } = await sb.from("clients").insert(payload).select().single();
    if (error) throw error;
    state.clients.unshift(data);
    if (payload.agreed_amount > 0) {
      const { data: inv, error: invErr } = await sb.from("client_invoices").insert({
        client_id: data.id, amount: payload.agreed_amount, description: "Initial agreed amount",
        invoice_date: todayISO(), status: "pending",
      }).select().single();
      if (!invErr) state.invoices.push(inv);
    }
    toast("Client added.", "success");
    renderPage();
  }, "Add Client");
}

function openPaymentModal(clientId) {
  const invs = clientId ? clientInvoices(clientId) : [];
  openModal("Record Payment", `
    ${!clientId ? `
    <div class="field"><label>Client <span class="req">*</span></label>
      <select name="client_id" id="payClientSelect" required>
        <option value="">Select client…</option>
        ${state.clients.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("")}
      </select>
    </div>` : ""}
    <div class="form-row2">
      <div class="field"><label>Amount (₹) <span class="req">*</span></label><input type="number" step="0.01" name="amount" required></div>
      <div class="field"><label>Payment Date</label><input type="date" name="payment_date" value="${todayISO()}"></div>
    </div>
    <div class="form-row2">
      <div class="field"><label>Payment Method</label>
        <select name="payment_method">
          <option value="bank_transfer">Bank Transfer</option><option value="upi">UPI</option>
          <option value="cash">Cash</option><option value="card">Credit/Debit Card</option><option value="other">Other</option>
        </select>
      </div>
      <div class="field"><label>Invoice (optional)</label>
        <select name="invoice_id" id="payInvoiceSelect">
          <option value="">— Unassigned —</option>
          ${invs.map(i => `<option value="${i.id}">${esc(i.invoice_number || fmtDate(i.invoice_date))} · ${inr(i.amount)}</option>`).join("")}
        </select>
      </div>
    </div>
    <div class="field"><label>Transaction ID</label><input name="transaction_id"></div>
    <div class="field"><label>Notes</label><textarea name="notes" rows="2"></textarea></div>
  `, async (fd) => {
    const cid = clientId || fd.get("client_id");
    if (!cid) throw new Error("Select a client.");
    const payload = {
      client_id: cid, invoice_id: fd.get("invoice_id") || null, amount: Number(fd.get("amount")),
      payment_date: fd.get("payment_date") || todayISO(), payment_method: fd.get("payment_method"),
      transaction_id: fd.get("transaction_id") || null, notes: fd.get("notes") || null,
    };
    const { data, error } = await sb.from("client_payments").insert(payload).select().single();
    if (error) throw error;
    state.payments.push(data);
    // Sync invoice status
    const inv = state.invoices.find(i => i.id === payload.invoice_id);
    if (inv) {
      const paidForInvoice = state.payments.filter(p => p.invoice_id === inv.id).reduce((s, p) => s + Number(p.amount), 0);
      const newStatus = paidForInvoice >= Number(inv.amount) ? "paid" : paidForInvoice > 0 ? "partially_paid" : "sent";
      if (newStatus !== inv.status) {
        await sb.from("client_invoices").update({ status: newStatus }).eq("id", inv.id);
        inv.status = newStatus;
      }
    }
    toast("Payment recorded.", "success");
    renderPage();
  }, "Record Payment");
  if (!clientId) {
    setTimeout(() => {
      document.getElementById("payClientSelect")?.addEventListener("change", (e) => {
        const invs2 = clientInvoices(e.target.value);
        const sel = document.getElementById("payInvoiceSelect");
        sel.innerHTML = `<option value="">— Unassigned —</option>` +
          invs2.map(i => `<option value="${i.id}">${esc(i.invoice_number || fmtDate(i.invoice_date))} · ${inr(i.amount)}</option>`).join("");
      });
    }, 0);
  }
}

// ---------- 17. CSV EXPORT ----------
function exportCSV(filename, headers, rows) {
  const csvRows = [headers.join(",")];
  rows.forEach(r => {
    csvRows.push(r.map(v => {
      const s = (v ?? "").toString().replace(/"/g, '""');
      return /[",\n]/.test(s) ? `"${s}"` : s;
    }).join(","));
  });
  const blob = new Blob([csvRows.join("\n")], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function numberToWordsINR(amount) {
  const num = Math.round(Number(amount) || 0);
  const ones = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten",
    "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
  const tens = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];
  function two(n) {
    if (n < 20) return ones[n];
    return tens[Math.floor(n / 10)] + (n % 10 ? " " + ones[n % 10] : "");
  }
  function three(n) {
    if (n >= 100) return ones[Math.floor(n / 100)] + " Hundred" + (n % 100 ? " " + two(n % 100) : "");
    return two(n);
  }
  if (num === 0) return "Zero Rupees";
  let n = num;
  const crore = Math.floor(n / 10000000); n %= 10000000;
  const lakh = Math.floor(n / 100000); n %= 100000;
  const thousand = Math.floor(n / 1000); n %= 1000;
  const hundred = n;
  const parts = [];
  if (crore) parts.push(three(crore) + " Crore");
  if (lakh) parts.push(three(lakh) + " Lakh");
  if (thousand) parts.push(three(thousand) + " Thousand");
  if (hundred) parts.push(three(hundred));
  return parts.join(" ") + " Rupees";
}

function printDoc(kind, id) {
  const D = DOCS[kind], doc = state[D.list].find(d => d.id === id); if (!doc) return;

  const items = state[D.items].filter(it => it[D.fk] === doc.id).sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  const win = window.open("", "_blank", "width=850,height=1100");

async function convertQuotation(id) {
  const q = state.quotations.find(x => x.id === id); if (!q) return;
  if (!confirm("Create a tax invoice from this quotation?")) return;
  try {
    const its = state.quotationItems.filter(i => i.quotation_id === id).sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
    const number = await nextDocNumber("invoice");
    const { data: inv, error } = await sb.from("client_invoices").insert({ client_id: q.client_id, invoice_number: number, invoice_date: todayISO(), due_date: addDaysISO(todayISO(), 30), status: "sent",
      subtotal: q.subtotal, tax_percent: q.tax_percent, discount_amount: q.discount_amount, amount: q.amount, description: q.description }).select().single();
    if (error) throw error;
    const { data: saved, error: e2 } = await sb.from("invoice_items").insert(its.map(i => ({ invoice_id: inv.id, service: i.service, description: i.description, item_note: i.item_note, sac_code: i.sac_code, unit: i.unit, quantity: i.quantity, rate: i.rate, amount: i.amount, sort_order: i.sort_order }))).select();
    if (e2) throw e2;
    await sb.from("quotations").update({ status: "converted" }).eq("id", id); q.status = "converted";
    state.invoices.unshift(inv); state.invoiceItems.push(...(saved || []));
    toast(`Invoice ${number} created.`, "success"); state.page = "invoices"; state.selectedInvoiceId = inv.id; buildNav(); renderPage();
  } catch (err) { toast(err.message || "Could not convert.", "error"); }
}

function getPeriodRange(period, customStart, customEnd) {
  const now = new Date();
  let start, end;
  if (period === "this_month") { start = new Date(now.getFullYear(), now.getMonth(), 1); end = new Date(now.getFullYear(), now.getMonth() + 1, 0); }
  else if (period === "last_month") { start = new Date(now.getFullYear(), now.getMonth() - 1, 1); end = new Date(now.getFullYear(), now.getMonth(), 0); }
  else if (period === "this_quarter") { const q = Math.floor(now.getMonth() / 3); start = new Date(now.getFullYear(), q * 3, 1); end = new Date(now.getFullYear(), q * 3 + 3, 0); }
  else if (period === "this_year") { start = new Date(now.getFullYear(), 0, 1); end = new Date(now.getFullYear(), 11, 31); }
  else if (period === "custom") { start = customStart ? new Date(customStart) : new Date(now.getFullYear(), now.getMonth(), 1); end = customEnd ? new Date(customEnd) : now; }
  else { start = new Date(now.getFullYear(), now.getMonth(), 1); end = now; }
  const spanDays = Math.round((end - start) / 86400000) + 1;
  const prevEnd = new Date(start); prevEnd.setDate(prevEnd.getDate() - 1);
  const prevStart = new Date(prevEnd); prevStart.setDate(prevStart.getDate() - spanDays + 1);
  return { start, end, prevStart, prevEnd };
}
function isoInRangeInclusive(dateStr, start, end) {
  const d = new Date(dateStr);
  return d >= start && d <= end;
}

  actions.innerHTML = "";

  const expenses = sumExpense(d => isoInRangeInclusive(d, start, end));
  const netProfit = revenue - expenses;
  const margin = revenue > 0 ? (netProfit / revenue) * 100 : 0;
  const prevRevenue = state.payments.filter(p => isoInRangeInclusive(p.payment_date, prevStart, prevEnd)).reduce((s, p) => s + Number(p.amount), 0);
  const prevExpenses = sumExpense(d => isoInRangeInclusive(d, prevStart, prevEnd));
  const prevProfit = prevRevenue - prevExpenses;

  content.innerHTML = `
    <div class="pill-toggle" id="pnlPeriods">
      ${["this_month", "last_month", "this_quarter", "this_year", "custom"].map(p => `<div class="pill ${period === p ? "active" : ""}" data-p="${p}">${p.split("_").map(w => w[0].toUpperCase() + w.slice(1)).join(" ")}</div>`).join("")}

      <div class="stat-card"><div class="label">Expenses</div><div class="amount">${inr(expenses)}</div>${deltaHtml(-pctDelta(expenses, prevExpenses))}</div>
      <div class="stat-card"><div class="label">Net Profit</div><div class="amount" style="color:${netProfit >= 0 ? "var(--green)" : "var(--red)"};">${inr(netProfit)}</div>${deltaHtml(pctDelta(netProfit, prevProfit))}</div>
      <div class="stat-card"><div class="label">Profit Margin</div><div class="amount">${margin.toFixed(1)}%</div><span class="delta flat">Net Profit ÷ Revenue</span></div>
    </div>
    <div class="panel">
      <div class="panel-header"><h3>Revenue, Expenses & Profit Trend</h3></div>
      <div class="panel-body"><canvas id="pnlCanvas" height="90"></canvas></div>
    </div>
  `;
  document.querySelectorAll("#pnlPeriods .pill").forEach(p => p.addEventListener("click", () => { state.pnlPeriod = p.dataset.p; renderPage(); }));
  document.getElementById("pnlFrom")?.addEventListener("change", e => { state.pnlCustomStart = e.target.value; renderPage(); });
  document.getElementById("pnlTo")?.addEventListener("change", e => { state.pnlCustomEnd = e.target.value; renderPage(); });
  drawPnLChart(start, end);
}
function drawPnLChart(start, end) {
  const months = [];
  let cursor = new Date(start.getFullYear(), start.getMonth(), 1);
  const endMonth = new Date(end.getFullYear(), end.getMonth(), 1);
  while (cursor <= endMonth && months.length < 12) { months.push(new Date(cursor)); cursor.setMonth(cursor.getMonth() + 1); }
  if (!months.length) months.push(new Date());
  const labels = months.map(m => m.toLocaleDateString("en-IN", { month: "short", year: "2-digit" }));
  const rev = months.map(m => { const s = new Date(m.getFullYear(), m.getMonth(), 1), e = new Date(m.getFullYear(), m.getMonth() + 1, 0); return state.payments.filter(p => isoInRangeInclusive(p.payment_date, s, e)).reduce((a, p) => a + Number(p.amount), 0); });
  const exp = months.map(m => { const s = new Date(m.getFullYear(), m.getMonth(), 1), e = new Date(m.getFullYear(), m.getMonth() + 1, 0); return sumExpense(d => isoInRangeInclusive(d, s, e)); });
  const profit = rev.map((r, idx) => r - exp[idx]);
  const ctx = document.getElementById("pnlCanvas");
  if (!ctx) return;
  if (pnlChart) pnlChart.destroy();
  pnlChart = new Chart(ctx, {
    data: {
      labels, datasets: [
        { type: "bar", label: "Revenue", data: rev, backgroundColor: "#0ea36f", borderRadius: 5 },
        { type: "bar", label: "Expenses", data: exp, backgroundColor: "#e0473d", borderRadius: 5 },
        { type: "line", label: "Profit", data: profit, borderColor: "#4f46e5", backgroundColor: "#4f46e5", tension: .3, pointRadius: 3 },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 11 } } } },
      scales: { y: { ticks: { callback: v => "₹" + (v >= 1000 ? (v / 1000) + "k" : v), font: { size: 10 } }, grid: { color: "#f0f1f6" } }, x: { grid: { display: false }, ticks: { font: { size: 10 } } } },
    },
  });
  ctx.parentElement.style.height = "280px";
}

// ---------- 23. REPORTS ----------
function renderReports(content, actions) {
  actions.innerHTML = "";
  content.innerHTML = `
    <div class="toolbar">
      <div class="toolbar-left">
        <select class="select-sm" id="reportTypeSelect">
          <option value="income">Income Report</option>
          <option value="expense">Expense Report</option>
          <option value="pnl">Profit & Loss Report</option>
          <option value="client_payment">Client Payment Report</option>
          <option value="receivables">Outstanding Receivables Report</option>
          <option value="monthly">Monthly Financial Report</option>
        </select>
        <select class="select-sm" id="reportRangeSelect">
          <option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="90">Last 3 months</option><option value="365">Last 12 months</option><option value="all">All time</option>
        </select>
      </div>
      <button class="btn btn-primary" id="exportReportCsv">Export CSV</button>
    </div>
    <div class="panel"><div class="panel-body no-pad table-wrap" id="reportOutput"></div></div>
  `;
  document.getElementById("reportTypeSelect").value = state.reportType;
  document.getElementById("reportRangeSelect").value = state.reportRange;
  document.getElementById("reportTypeSelect").addEventListener("change", e => { state.reportType = e.target.value; renderPage(); });
  document.getElementById("reportRangeSelect").addEventListener("change", e => { state.reportRange = e.target.value; renderPage(); });
  document.getElementById("exportReportCsv").addEventListener("click", () => exportCurrentReport());
  renderReportOutput();
}
function getReportRows() {
  const range = state.reportRange;
  const filterFn = d => range === "all" ? true : inRange(d, range);
  const type = state.reportType;
  if (type === "income") {
    const src = state.payments.filter(p => filterFn(p.payment_date));
    return { headers: ["Date", "Client", "Amount", "Method"], rows: src.map(p => [fmtDate(p.payment_date), state.clients.find(c => c.id === p.client_id)?.name || "—", inr(p.amount), (p.payment_method || "").replace("_", " ")]), raw: src.map(p => [p.payment_date, state.clients.find(c => c.id === p.client_id)?.name || "", p.amount, p.payment_method || ""]) };
  }
  if (type === "expense") {
    const src = state.expenses.filter(e => filterFn(e.expense_date));
    return { headers: ["Date", "Expense", "Category", "Vendor", "Amount"], rows: src.map(e => [fmtDate(e.expense_date), e.name, state.categories.find(c => c.id === e.category_id)?.name || "—", e.vendor || "—", inr(e.amount)]), raw: src.map(e => [e.expense_date, e.name, state.categories.find(c => c.id === e.category_id)?.name || "", e.vendor || "", e.amount]) };
  }
  if (type === "client_payment") {
    return { headers: ["Client", "Total Billed", "Total Paid", "Outstanding", "Status"], rows: state.clients.map(c => [c.name, inr(totalBilled(c.id)), inr(totalPaid(c.id)), inr(outstanding(c.id)), clientStatus(c.id)]), raw: state.clients.map(c => [c.name, totalBilled(c.id), totalPaid(c.id), outstanding(c.id), clientStatus(c.id)]) };
  }
  if (type === "receivables") {
    const owing = state.clients.filter(c => outstanding(c.id) > 0);
    return { headers: ["Client", "Billed", "Paid", "Pending", "Status"], rows: owing.map(c => [c.name, inr(totalBilled(c.id)), inr(totalPaid(c.id)), inr(outstanding(c.id)), clientStatus(c.id)]), raw: owing.map(c => [c.name, totalBilled(c.id), totalPaid(c.id), outstanding(c.id), clientStatus(c.id)]) };
  }
  if (type === "pnl") {
    const rev = sumIncome(filterFn); const exp = sumExpense(filterFn); const profit = rev - exp;
    return { headers: ["Metric", "Value"], rows: [["Revenue", inr(rev)], ["Expenses", inr(exp)], ["Net Profit", inr(profit)], ["Profit Margin", rev > 0 ? ((profit / rev) * 100).toFixed(1) + "%" : "0%"]], raw: [["Revenue", rev], ["Expenses", exp], ["Net Profit", profit], ["Profit Margin", rev > 0 ? ((profit / rev) * 100).toFixed(1) : "0"]] };
  }
  // monthly
  const months = [];
  for (let i = 11; i >= 0; i--) { const d = new Date(); d.setMonth(d.getMonth() - i); months.push(new Date(d.getFullYear(), d.getMonth(), 1)); }
  const raw = months.map(m => {
    const s = m, e = new Date(m.getFullYear(), m.getMonth() + 1, 0);
    const inc = state.payments.filter(p => isoInRangeInclusive(p.payment_date, s, e)).reduce((a, p) => a + Number(p.amount), 0);
    const exp = sumExpense(d => isoInRangeInclusive(d, s, e));
    const profit = inc - exp;
    return [m.toLocaleDateString("en-IN", { month: "long", year: "numeric" }), inc, exp, profit, inc > 0 ? ((profit / inc) * 100).toFixed(1) : "0"];
  });
  const rows = raw.map(r => [r[0], inr(r[1]), inr(r[2]), inr(r[3]), r[4] + "%"]);
  return { headers: ["Month", "Income", "Expenses", "Profit", "Margin"], rows, raw };
}
function renderReportOutput() {
  const { headers, rows } = getReportRows();
  const out = document.getElementById("reportOutput");
  if (!out) return;
  if (!rows.length) { out.innerHTML = emptyRow("No data for this report."); return; }
  out.innerHTML = `<table><thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map(v => `<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function exportCurrentReport() {
  const { headers, raw } = getReportRows();
  exportCSV(`${state.reportType}-report.csv`, headers, raw);
}

// ---------- 24. SETTINGS ----------
function renderSettings(content, actions) {
  actions.innerHTML = "";
  const s = state.settings || {};
  content.innerHTML = `
    <div class="grid-2b">
      <div class="panel">
        <div class="panel-header"><h3>Business Information</h3></div>
        <div class="panel-body">
          <form id="businessForm">
            <div class="field"><label>Business Name</label><input name="business_name" value="${esc(s.business_name || "")}"></div>
            <div class="form-row2">
              <div class="field"><label>Email</label><input type="email" name="email" value="${esc(s.email || "")}"></div>
              <div class="field"><label>Phone</label><input name="phone" value="${esc(s.phone || "")}"></div>
            </div>
            <div class="field"><label>Address</label><input name="address" value="${esc(s.address || "")}"></div>
            <div class="form-row2">
              <div class="field"><label>GST Number</label><input name="gst_number" value="${esc(s.gst_number || "")}"></div>
              <div class="field"><label>PAN</label><input name="pan_number" value="${esc(s.pan_number || "")}"></div>
            </div>
            <div class="field"><label>Website</label><input name="website" value="${esc(s.website || "")}"></div>
            <button type="submit" class="btn btn-primary" style="width:100%;margin-top:4px;">Save Business Info</button>
          </form>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header"><h3>Invoice Settings</h3></div>
        <div class="panel-body">
          <form id="invoiceSettingsForm">
            <div class="form-row2">
              <div class="field"><label>Invoice Prefix</label><input name="invoice_prefix" value="${esc(s.invoice_prefix || "VD-INV")}"></div>
              <div class="field"><label>Next Invoice Number</label><input type="number" name="next_invoice_number" value="${s.next_invoice_number || 1}"></div>
            </div>
            <div class="form-row2">
              <div class="field"><label>Quotation Prefix</label><input name="quotation_prefix" value="${esc(s.quotation_prefix || "GA/QT/25-26/")}"></div>
              <div class="field"><label>Next Quotation Number</label><input type="number" name="next_quotation_number" value="${s.next_quotation_number || 1}"></div>
            </div>
            <div class="field"><label>Payment Terms</label><input name="payment_terms" value="${esc(s.payment_terms || "Due within 15 days")}"></div>
            <div class="field"><label>Default Tax (%)</label><input type="number" step="0.01" name="default_tax_percent" value="${s.default_tax_percent || 0}"></div>
            <div class="field"><label>Business State</label><input name="state" placeholder="e.g. Andhra Pradesh" value="${esc(s.state || "")}"></div>
            <div class="field"><label>Currency</label><input value="INR (₹)" disabled style="background:#f2f3f8;color:var(--ink-soft);"></div>
            <button type="submit" class="btn btn-primary" style="width:100%;margin-top:4px;">Save Invoice Settings</button>
          </form>
        </div>
      </div>
    </div>
    <div class="panel" style="margin-top:16px;">
      <div class="panel-header"><h3>Bank Details &amp; Terms (for printed invoices)</h3></div>
      <div class="panel-body">
        <form id="bankForm">
          <div class="form-row2">
            <div class="field"><label>Bank Name</label><input name="bank_name" value="${esc(s.bank_name || "")}"></div>
            <div class="field"><label>Branch</label><input name="bank_branch" value="${esc(s.bank_branch || "")}"></div>
          </div>
          <div class="form-row2">
            <div class="field"><label>Account No.</label><input name="bank_account_no" value="${esc(s.bank_account_no || "")}"></div>
            <div class="field"><label>IFSC Code</label><input name="bank_ifsc" value="${esc(s.bank_ifsc || "")}"></div>
          </div>
          <div class="field"><label>Terms &amp; Conditions (shown on printed invoice, one per line)</label><textarea name="terms_conditions" rows="3">${esc(s.terms_conditions || "Goods once sold will not be taken back or exchanged.")}</textarea></div>
          <button type="submit" class="btn btn-primary" style="width:100%;margin-top:4px;">Save Bank &amp; Terms</button>
        </form>
      </div>
    </div>
    <div class="panel" style="margin-top:16px;">
      <div class="panel-header"><h3>Signature / Stamp (for printed invoices)</h3></div>
      <div class="panel-body">
        <p style="font-size:12.5px;color:var(--ink-soft);margin-top:-4px;margin-bottom:12px;">
          Upload a PNG of your signature or company stamp — it prints above "Authorised Signatory For" on the invoice. A transparent background works best.
        </p>
        <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
          ${s.stamp_image ? `<img src="${s.stamp_image}" alt="Stamp preview" style="max-width:120px;max-height:120px;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;">` : `<div style="font-size:12.5px;color:var(--ink-soft);">No stamp uploaded yet.</div>`}
          <div style="display:flex;flex-direction:column;gap:8px;">
            <input type="file" id="stampFileInput" accept="image/png,image/jpeg" style="font-size:12.5px;">
            ${s.stamp_image ? `<button type="button" class="btn btn-ghost" id="removeStampBtn" style="font-size:12.5px;padding:6px 12px;">Remove Stamp</button>` : ""}
          </div>
        </div>
      </div>
    </div>
    <div class="panel" style="margin-top:16px;">
      <div class="panel-header"><h3>Expense Categories</h3></div>
      <div class="panel-body">
        <div style="display:flex;gap:8px;margin-bottom:14px;">
          <input id="newCategoryInput" placeholder="New category name" style="flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;">
          <button class="btn btn-primary" id="addCategoryBtn">+ Add</button>
        </div>
        <div id="categoryList" style="display:flex;flex-wrap:wrap;gap:8px;">
          ${state.categories.map(c => `
            <div class="pill" style="display:flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;">
              <span>${esc(c.name)}</span>
              <button data-del-cat="${c.id}" style="border:none;background:none;color:var(--red);cursor:pointer;font-size:14px;line-height:1;">×</button>
            </div>`).join("")}
        </div>
      </div>
    </div>
  `;
  document.getElementById("businessForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    await saveSettings(Object.fromEntries(new FormData(e.target).entries()));
  });
  document.getElementById("invoiceSettingsForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = Object.fromEntries(new FormData(e.target).entries());
    payload.next_invoice_number = Number(payload.next_invoice_number);
    payload.next_quotation_number = Number(payload.next_quotation_number);
    payload.default_tax_percent = Number(payload.default_tax_percent);
    await saveSettings(payload);
  });
  document.getElementById("bankForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    await saveSettings(Object.fromEntries(new FormData(e.target).entries()));
  });
  document.getElementById("stampFileInput").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!/^image\/(png|jpeg)$/.test(file.type)) { toast("Please choose a PNG or JPG image.", "error"); return; }
    if (file.size > 1.5 * 1024 * 1024) { toast("Image is too large — please use one under 1.5MB.", "error"); return; }
    const dataUrl = await new Promise((res, rej) => {
      const reader = new FileReader();
      reader.onload = () => res(reader.result);
      reader.onerror = () => rej(new Error("Could not read file."));
      reader.readAsDataURL(file);
    }).catch(err => { toast(err.message, "error"); return null; });
    if (!dataUrl) return;
    await saveSettings({ stamp_image: dataUrl });
  });
  document.getElementById("removeStampBtn")?.addEventListener("click", async () => {
    if (!confirm("Remove the uploaded stamp/signature?")) return;
    await saveSettings({ stamp_image: null });
  });
  document.getElementById("addCategoryBtn").addEventListener("click", async () => {
    const input = document.getElementById("newCategoryInput");
    const name = input.value.trim();
    if (!name) return;
    try {
      const { data, error } = await sb.from("expense_categories").insert({ name }).select().single();
      if (error) throw error;
      state.categories.push(data);
      state.categories.sort((a, b) => a.name.localeCompare(b.name));
      toast("Category added.", "success");
      renderPage();
    } catch (err) { toast(err.message, "error"); }
  });
  document.querySelectorAll("[data-del-cat]").forEach(btn => btn.addEventListener("click", async () => {
    const id = btn.dataset.delCat;
    if (state.expenses.some(e => e.category_id === id)) { toast("Can't delete — expenses use this category.", "error"); return; }
    try {
      const { error } = await sb.from("expense_categories").delete().eq("id", id);
      if (error) throw error;
      state.categories = state.categories.filter(c => c.id !== id);
      toast("Category removed.", "success");
      renderPage();
    } catch (err) { toast(err.message, "error"); }
  }));
}
async function saveSettings(payload) {
  try {
    let result;
    if (state.settings?.id) result = await sb.from("business_settings").update(payload).eq("id", state.settings.id).select().single();
    else result = await sb.from("business_settings").insert(payload).select().single();
    if (result.error) throw result.error;
    state.settings = withDefaults(result.data);
    toast("Settings saved.", "success");
  } catch (err) {
    toast(err.message || "Could not save settings.", "error");
  }
}
</script>
</body>
</html>
